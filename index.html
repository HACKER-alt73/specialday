<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Have a Happy Birthday!</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Courier+Prime&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root{--bg1:#ffe3ec;--bg2:#ffc2d4;--card:#fff;--text:#5a2338;--accent:#ff4275;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1020;--bg2:#4a1a33;--card:#3a1a2b;--text:#ffe3ec}}
:root[data-theme="dark"]{--bg1:#2a1020;--bg2:#4a1a33;--card:#3a1a2b;--text:#ffe3ec}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);font-family:'Courier Prime',monospace;text-align:center;overflow-x:hidden}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px 16px;position:relative}
h1{font-family:'Dancing Script',cursive;color:var(--accent);font-size:clamp(3rem,12vw,6rem);margin:0;text-shadow:0 3px 12px rgba(255,66,117,.3)}
.sub{opacity:.8}
.cake{font-size:clamp(6rem,24vw,10rem);cursor:pointer;animation:bob 2.4s ease-in-out infinite;line-height:1}
@keyframes bob{50%{transform:translateY(-12px)}}
.cake.locked{filter:grayscale(.9);opacity:.6;animation:none}
.row{font-size:2.2rem;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mail{font-size:3.4rem;cursor:pointer;background:var(--card);border-radius:50%;width:90px;height:90px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(255,66,117,.35);animation:pulse 1.8s infinite;border:0}
@keyframes pulse{50%{transform:scale(1.08)}}
.balloon{position:absolute;font-size:3.4rem;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-24px) rotate(6deg)}}
.heart-particle{position:fixed;pointer-events:none;z-index:40;font-size:18px;animation:fadeup 1s forwards}
@keyframes fadeup{to{opacity:0;transform:translateY(-40px)}}
/* letter modal */
.boxMail{position:fixed;inset:0;background:rgba(10,0,10,.85);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.boxMail.active{display:flex}
.x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:18px;font-size:2rem;color:#fff;cursor:pointer;background:none;border:0}
.card{background:var(--card);border-radius:20px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:0 14px 40px rgba(0,0,0,.4);animation:pop .6s}
@keyframes pop{from{transform:scale(.6) rotateY(90deg);opacity:0}}
.card img.me{width:110px;height:110px;object-fit:cover;border-radius:50%;border:4px solid var(--accent)}
.card h3{font-family:'Dancing Script',cursive;color:var(--accent);font-size:2.2rem;margin:8px 0}
.letter{text-align:left;line-height:1.7;white-space:pre-wrap;min-height:120px}
/* gallery */
.gal{padding:50px 16px;max-width:900px;margin:auto}
.gal h2{font-family:'Dancing Script',cursive;color:var(--accent);font-size:2.6rem;margin:0 0 16px}
.grid{columns:2;column-gap:12px}@media(min-width:700px){.grid{columns:3}}
.grid img{width:100%;display:block;border-radius:14px;margin-bottom:12px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .25s}
.grid img:hover{transform:scale(1.03) rotate(-1deg)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:200}
#lb img{max-width:94vw;max-height:90vh;border-radius:12px}
footer{padding:26px;opacity:.7;font-size:.9rem}
.cd{font-size:1.25rem;font-weight:bold;color:var(--accent);min-height:1.6em}
.mail.locked{filter:grayscale(.9);opacity:.65;animation:none}
</style></head><body>
<div class="hero">
  <span class="balloon" style="left:6%;top:12%">🎈</span><span class="balloon" style="right:6%;top:20%;animation-delay:1.2s">🎈</span>
  <div class="sub">☁️ ☁️ ☁️</div>
  <h1>Happy Birthday</h1>
  <div class="sub" id="who"></div>
  <div class="cd" id="cd"></div>
  <button id="mus" style="position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:60;border:0;border-radius:30px;padding:10px 14px;background:var(--card);color:var(--text);font:inherit;cursor:pointer">🎵 Music</button>
  <div class="cake" id="cake" title="Tap the cake">🎂</div>
  <div class="sub" id="cakenote">🔒 The cake unlocks when the countdown ends</div>
  <div class="row">🎁 🎁 🎁 🎁 🎁 🎁</div>
  <button class="mail" id="mail" aria-label="Open letter">💌</button>
  <div class="sub" id="mailnote">🔒 Your letter and our photos unlock when the countdown ends</div>
  <div class="sub" id="gl" style="display:none"><a href="#gal" style="color:var(--accent)">See our memories ↓</a></div>
</div>

<div class="boxMail" id="box"><button class="x" id="close" aria-label="Close">✕</button>
  <div class="card"><img class="me" id="me" alt="">
    <h3>Happy Birthday</h3><h3 style="font-size:1.6rem">To You!</h3>
    <div class="letter" id="letter"></div></div></div>

<section class="gal" id="gal" style="display:none"><h2>Our memories</h2><div class="grid" id="grid"></div></section>
<footer id="foot"></footer>
<div id="lb"><img id="lbimg" alt=""></div>

const HER_NAME="My Love";

From the moment you walked into my life, you turned my whole world upside down in the most beautiful way. I think about you in the quiet of the morning and the rush of the afternoon. You are the smile on my face, the warmth in my chest, and the crazy, beautiful melody my heart plays on repeat.

I still remember that night at the little café, the colorful prayer flags above us and the tin walls glowing red. You flashed your peace sign, I tried to look serious, and neither of us could stop smiling afterwards. That’s when I realized the best places are simply the ones where you are.

I love our quiet days in the bamboo room, your head on my shoulder, you making that kissy face just to make me laugh. Nothing fancy, no plans, and yet those are the days I would replay forever.

I treasure all our small moments too: the cheek-to-cheek selfies we take when we should be sleeping, your pink striped pajamas, the way your necklace catches the light when you smile, and how you always know how to make a heavy day feel lighter.

On this special day, I want you to know that my heart will always beat to your rhythm. May your day be as magical and radiant as you are to me.

${YOUR_NAME}`;

const $=id=>document.getElementById(id);
$('who').textContent="For "+HER_NAME+" ❤";
$('foot').textContent="Made with ❤ by "+YOUR_NAME;
$('me').src=IMGS[1]||IMGS[0];
IMGS.forEach(s=>{const i=document.createElement('img');i.src=s;i.alt="Our memory";i.onclick=()=>{$('lbimg').src=s;$('lb').style.display='flex'};$('grid').appendChild(i)});
$('lb').onclick=()=>$('lb').style.display='none';

document.addEventListener('pointermove',e=>{const h=document.createElement('span');h.className='heart-particle';h.textContent='💗';
 h.style.left=e.clientX+'px';h.style.top=e.clientY+'px';h.style.fontSize=(10+Math.random()*18)+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),1000)});

const BIRTHDAY=new Date("2026-10-23T00:00:00");
let unlocked=false,ac=null,mt=null,playing=false;
const SONG=[[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2],[392,.75],[392,.25],[440,1],[392,1],[587,1],[523,2],[392,.75],[392,.25],[784,1],[659,1],[523,1],[494,1],[440,2],[698,.75],[698,.25],[659,1],[523,1],[587,1],[523,2]];
function playSong(){if(!playing||!ac)return;let t=ac.currentTime+.1;SONG.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain(),L=d*.55;o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+L-.02);o.start(t);o.stop(t+L);t+=L});mt=setTimeout(playSong,(t-ac.currentTime)*1000+900)}
function music(on){if(on===playing)return;if(on){ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume();playing=true;playSong()}else{playing=false;clearTimeout(mt);if(ac){ac.close();ac=null}}$('mus').textContent=playing?'🔇 Stop music':'🎵 Music'}
$('mus').onclick=()=>music(!playing);
function unlock(first){unlocked=true;$('cd').textContent='🎉 It’s your birthday! 🎉';$('mail').classList.remove('locked');$('gal').style.display='';$('gl').style.display='';$('cake').classList.remove('locked');$('cakenote').textContent='Tap the cake 🎆';$('mailnote').textContent='Your letter is ready. Tap to open 💌';if(first)confetti({particleCount:150,spread:90,origin:{y:.6},colors:COL,zIndex:1000})}
function tick(){if(unlocked)return;const d=BIRTHDAY-new Date();if(d<=0){unlock(true);return}
 const dd=Math.floor(d/864e5),h=Math.floor(d%864e5/36e5),m=Math.floor(d%36e5/6e4),s=Math.floor(d%6e4/1e3);
 $('cd').textContent=(dd?dd+'d ':'')+h+'h '+m+'m '+s+'s until your birthday 🎂'}
const COL=['#ff4275','#ff8da9','#ffffff','#ff0a7c'];
$('mail').classList.add('locked');$('cake').classList.add('locked');
if(location.hash==='#preview'){unlock(false)}else{tick();setInterval(tick,1000)}
let timer=null;
$('mail').onclick=()=>{if(!unlocked){$('mailnote').textContent='🔒 Not yet… wait for the countdown to finish ❤';return}$('box').classList.add('active');const el=$('letter');el.textContent='';clearInterval(timer);let i=0;
 setTimeout(()=>{timer=setInterval(()=>{if(i<LETTER.length){el.textContent+=LETTER[i++]}else clearInterval(timer)},30)},500)};
$('close').onclick=()=>{$('box').classList.remove('active');clearInterval(timer)};
$('letter').onclick=()=>{clearInterval(timer);$('letter').textContent=LETTER};

$('cake').onclick=()=>{if(!unlocked){$('cakenote').textContent='🔒 Not yet… wait for the countdown to finish ❤';return}music(true);
 const o=document.createElement('div');
 o.style.cssText="position:fixed;inset:0;background:rgba(10,0,10,.9);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1s";
 const m=document.createElement('h1');m.style.cssText="color:#ff4275;font-size:clamp(2.4rem,10vw,4.5rem);text-shadow:0 0 15px #ff4275,0 0 30px #ff4275;transform:scale(.3) rotate(-5deg);transition:all 1.5s cubic-bezier(.175,.885,.32,1.275);padding:16px";
 m.innerHTML="Happy Birthday "+HER_NAME+" ❤️<br><span style=\"font-size:1.4rem;color:#ffebf0;font-family:'Courier Prime',monospace;text-shadow:none\">Wishing you a beautiful year ahead!</span>";
 o.appendChild(m);document.body.appendChild(o);
 setTimeout(()=>{o.style.opacity=1;m.style.transform='none'},100);
 const end=Date.now()+6000,d={startVelocity:35,spread:360,ticks:100,zIndex:1000,scalar:1.2};
 const r=(a,b)=>Math.random()*(b-a)+a;
 const iv=setInterval(()=>{const left=end-Date.now();if(left<=0)return clearInterval(iv);const n=60*left/6000;
  confetti({...d,particleCount:n,origin:{x:r(.1,.3),y:Math.random()-.2},colors:COL});
  confetti({...d,particleCount:n,origin:{x:r(.7,.9),y:Math.random()-.2},colors:COL})},250);
 setTimeout(()=>confetti({particleCount:150,spread:80,origin:{y:.6},colors:COL,zIndex:1000}),500);
 o.onclick=()=>{o.style.opacity=0;clearInterval(iv);setTimeout(()=>o.remove(),1000)};
};
</script></body></html>
